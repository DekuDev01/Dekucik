*{

box-sizing:border-box;

body{

height:100vh;
display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(135deg,#000000,#120022,#3b0066);

}

/* glowing background */

body::before{

content:"";

position:absolute;

width:600px;
height:600px;

background:purple;

filter:blur(220px);

opacity:0.4;

top:-200px;

left:-200px;

}

/* glass container */

.card{

width:380px;

padding:40px;

border-radius:25px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.1);

box-shadow:0 0 40px rgba(0,0,0,0.7);

}

/* profile */

.profile{

border-radius:50%;

object-fit:cover;

margin-bottom:15px;

border:3px solid rgba(255,255,255,0.2);

}

/* name */

h1{

font-size:24px;

margin-bottom:8px;

}

/* desc */

.desc{

font-size:14px;

opacity:0.8;

margin-bottom:20px;

}

/* follower box */

.followers{

padding:12px;

border-radius:14px;

background:rgba(255,255,255,0.05);

border:1px solid rgba(255,255,255,0.1);

margin-bottom:25px;

}

/* button */

.btn{

display:block;

text-decoration:none;

color:white;

padding:13px;

margin-top:12px;

border-radius:12px;

font-weight:600;

background:linear-gradient(135deg,#6a00ff,#a100ff);

.btn:hover{
